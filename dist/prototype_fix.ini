# PrototypeFix configuration for prototype-windowed
# Requires PrototypeFix 1.8 by emoose

[Graphics]
FOVOffset = 0.0
ShadowMapResolution = 0
CustomResolution[0].Width = -1
CustomResolution[0].Height = -1
CustomResolution[1].Width = -1
CustomResolution[1].Height = -1

WindowResolution.Width = 1920
WindowResolution.Height = 1080
BorderlessWindow = true

[Performance]
DInputKeyboardMouseOnly = true
RemoveTickRateLimit = false
FixButtonTapTickRate = false
FPSLimitOverride = 0
VRAMAmount = 2048

[Misc]
PreferLooseFiles = true
UnlockDevMenu = false

[Audio]
MaxSampleRate = 384000

[CrashFixes]
CPUThreadCountFix = true
BillboardAdFix = true

[PrototypeFix]
VerboseLogging = false
